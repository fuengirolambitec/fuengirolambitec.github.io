            const dateRegex = /^\d{4}-\d{2}-\d{2}$/; 

            json_ARBOLADO_FUENGIROLA.features.forEach(feature => {
                const datesStr = feature.properties['actuación'];
                if (datesStr && datesStr !== 'NULL') {
                    // Dividir las fechas concatenadas
                    datesStr.split(/,\s*|\s*,\s*/).forEach(dateStr => {
                        const trimmedDateStr = dateStr.trim();
                        
                        // Validar formato YYYY-MM-DD
                        if (dateRegex.test(trimmedDateStr)) {
                            // Convertir a objeto Date. NOTA: Se usa el formato 'YYYY-MM-DD' para evitar problemas de zona horaria en el constructor.
                            const date = new Date(trimmedDateStr + 'T00:00:00'); 
                            const timestamp = date.getTime();

                            if (!isNaN(timestamp)) {
                                foundDate = true;
                                if (timestamp < minDateTimestamp) {
                                    minDateTimestamp = timestamp;
                                }
                                if (timestamp > maxDateTimestamp) {
                                    maxDateTimestamp = timestamp;
                                }
                            }
                        }
                    });
                }
            });

            if (foundDate) {
                // === INICIO DE LA CORRECCIÓN (Evitar problemas de Zona Horaria UTC) ===
                // Función auxiliar para formatear a YYYY-MM-DD (corregida para zona horaria)
                const formatToDateStr = (timestamp) => {
                    const date = new Date(timestamp);
                    // Usamos los componentes "locales" de la fecha, que es como se parseó (YYYY-MM-DD T00:00:00 local)
                    const y = date.getFullYear();
                    const m = String(date.getMonth() + 1).padStart(2, '0');
                    const d = String(date.getDate()).padStart(2, '0');
                    return `${y}-${m}-${d}`;
                };
                // === FIN DE LA CORRECCIÓN ===
                
                const min = formatToDateStr(minDateTimestamp);
                const max = formatToDateStr(maxDateTimestamp);
                return { min, max, minTimestamp: minDateTimestamp, maxTimestamp: maxDateTimestamp };
            }
            return null;
        }

            document.getElementById('toggle-filters-btn').addEventListener('click', function() {
                var menu = document.getElementById('menu');
                var mapWindow = document.getElementById('mapWindow');
                menu.classList.toggle('hidden');
                document.getElementById('toggle-filters-btn').setAttribute('aria-expanded', String(!menu.classList.contains('hidden')));
                
                if (menu.classList.contains('hidden')) {
                    mapWindow.style.width = '100%';
                } else {
                    mapWindow.style.width = '100%';
                }
                // Es muy importante invalidar el tamaño del mapa para que se redibuje correctamente
                window.setTimeout(function() {
                    map.invalidateSize();
                }, 400);
            });
